[study]
seed = 42
datasets = ["arena_33k", "mt_bench", "pandalm"]

[split]
unit = "record_id"
test_fraction = 0.2

[motivation]
# Descriptive Figure 1(b) study: no model is fitted.
n_boot = 200
# Judges above this tie rate are reported but excluded from the figure, since
# dropping their ties would leave a subset self-selected on their decisiveness.
tie_rate_exclude = 0.5
# Judges covering less than this share of a study's records in both display
# orders are reported but excluded as uncollected.
min_coverage = 0.5

[perturbation]
human_fractions = [0.1, 0.25, 0.5, 1.0]
llm_fractions = [0.25, 0.5, 1.0]
label_flip_probabilities = [0.0, 0.05, 0.1, 0.2]
