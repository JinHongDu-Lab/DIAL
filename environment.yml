# conda env create -f environment.yml && conda activate dial && python -m pip install -e .
name: dial
channels:
  - conda-forge
dependencies:
  - python >=3.11,<3.13
  - numpy >=1.24
  - scipy >=1.10
  - pandas >=2.0
  - matplotlib-base >=3.7
  - seaborn >=0.13
  - pyarrow >=15,<26
  - httpx >=0.27,<1
  - tiktoken >=0.13,<1
  - ipykernel >=6
  - nbconvert >=7
  - pytest >=8
  - pytest-cov >=5
  - pip
