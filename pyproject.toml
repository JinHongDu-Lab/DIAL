[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dial-judge"
version = "0.1.0"
description = "Position-debiased and human-calibrated ranking with LLM judges"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
viz = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "pyarrow>=15,<26",
    "ipykernel>=6",
]
data = [
    "httpx>=0.27,<1",
    "pyarrow>=15,<26",
    "tiktoken>=0.13,<1",
    "tomli>=2; python_version < '3.11'",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "slow: optimization-heavy integration tests",
]
